kind = "web"
previewPath = "/"
title = "MPPSC परीक्षा तैयारी"
version = "1.0.0"
id = "artifacts/mppsc-prep"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19451

[services.development]
run = "pnpm --filter @workspace/mppsc-prep run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mppsc-prep", "run", "build" ]
publicDir = "artifacts/mppsc-prep/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19451"
BASE_PATH = "/"
